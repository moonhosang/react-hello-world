<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      /* 순수 HTML 방식. 리액트도, 웹컴포넌트도 없다. */
      body {
        margin: 0;
        background: transparent;
        color: #1f2937;
        font-family: system-ui, "Malgun Gothic", sans-serif;
      }
      .dash { display: flex; flex-direction: column; gap: 12px; }
      .announcement {
        background: #eef2ff;
        color: #6366f1;
        border-radius: 10px;
        padding: 12px 14px;
        font-weight: 600;
        font-size: 14px;
      }
      .user-chip { display: flex; align-items: center; gap: 12px; }
      .user-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #eef2ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        flex-shrink: 0;
      }
      .user-meta { display: flex; flex-direction: column; line-height: 1.3; }
      .user-name { font-weight: 700; font-size: 15px; }
      .user-role { font-size: 13px; color: #6b7280; }
      .clock { margin: 6px 0; color: #6b7280; }
      .weather-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .weather-city { font-weight: 700; font-size: 16px; }
      .weather-mood { font-size: 13px; color: #6b7280; }
      .weather-temp { font-size: 48px; font-weight: 800; margin-bottom: 10px; }
      .weather-details { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .weather-details li {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        padding: 7px 12px;
        background: rgba(0, 0, 0, 0.04);
        border-radius: 8px;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #e2e8f0; }
        .announcement { background: #312e81; color: #c7d2fe; }
        .user-avatar { background: #312e81; }
        .clock, .weather-mood, .user-role { color: #94a3b8; }
        .weather-details li { background: rgba(255, 255, 255, 0.06); }
      }
    </style>
  </head>
  <body>
    <div class="dash">
      <!-- ⚠️ 공지 1/3 : 아래 2, 3과 '완전히 똑같은 코드'를 복사-붙여넣기 한 것이다 -->
      <div class="announcement">📢 오늘은 리액트 컴포넌트를 배우는 날이다.</div>
      <!-- ⚠️ 공지 2/3 : 위와 똑같은 코드 복붙 -->
      <div class="announcement">📢 오늘은 리액트 컴포넌트를 배우는 날이다.</div>
      <!-- ⚠️ 공지 3/3 : 또 복붙. 문구를 바꾸려면 이 3곳을 '전부 손으로' 고쳐야 한다 -->
      <div class="announcement">📢 오늘은 리액트 컴포넌트를 배우는 날이다.</div>

      <!-- ⚠️ 사용자 칩 1/2 : 컴포넌트가 없으니 이 구조를 통째로 손으로 쓴다 -->
      <div class="user-chip">
        <div class="user-avatar">🧑‍💻</div>
        <div class="user-meta">
          <span class="user-name">김코딩</span>
          <span class="user-role">리액트 입문자</span>
        </div>
      </div>
      <!-- ⚠️ 사용자 칩 2/2 : 위와 똑같은 코드를 또 복붙. 아바타를 바꾸려면 두 곳 다 고쳐야 한다 -->
      <div class="user-chip">
        <div class="user-avatar">🧑‍💻</div>
        <div class="user-meta">
          <span class="user-name">김코딩</span>
          <span class="user-role">리액트 입문자</span>
        </div>
      </div>
      <div class="clock">🕐 이 화면이 그려진 시각: <b id="time"></b></div>

      <!-- 날씨 위젯도 컴포넌트가 없으니 이 구조를 통째로 손으로 써야 한다 -->
      <div class="weather">
        <div class="weather-head">
          <span class="weather-city">📍 서울</span>
          <span class="weather-mood">더운 날 ☀️</span>
        </div>
        <div class="weather-temp">26°</div>
        <ul class="weather-details">
          <li><span>습도</span><b>60%</b></li>
          <li><span>바람</span><b>3 m/s</b></li>
          <li><span>체감</span><b>28°</b></li>
        </ul>
      </div>
    </div>

    <script>
      // 시각만 채워 넣는다 (순수 DOM). 나머지는 전부 손으로 쓴 정적 HTML이다.
      document.getElementById('time').textContent = new Date().toLocaleTimeString('ko-KR')
    </script>
  </body>
</html>
